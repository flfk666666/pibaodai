function itemView(parent,item){const d=add(parent,'details','item');d.dataset.item=item.id;const s=add(d,'summary','');add(s,'span','item-name',item.id+' '+item.name);const grade=add(s,'span','item-grade',finite(item.score)?fmt(item.score,1):'待补');add(grade,'small','',coverageLabels[item.coverage?.level]||'材料范围单列');const b=add(d,'div','item-body');add(b,'p','',item.evaluation?.reason||item.reason||'本项尚无足够的可评内容。');if(item.numeric_inputs){add(b,'p','formula',rawText(item.numeric_inputs));const calc=item.calculation||item.numeric_result||item.numeric_recompute;if(calc?.formula)add(b,'p','formula',calc.formula);if(calc?.note&&/[\u3400-\u9fff]/.test(calc.note))add(b,'p','',calc.note);}const c=add(b,'div','scope');add(c,'b','','这次评到哪里');add(c,'p','',item.coverage?.scope||'仅覆盖已提供材料。');if(list(item.coverage?.gaps).length)add(c,'p','','未覆盖：'+item.coverage.gaps.join('；'));if(item.coverage?.higher_unassessed)add(c,'p','','更高要求尚未观察，不是能力上限。');const range=item.score_range;if(Array.isArray(range)&&range[0]!==range[1])add(b,'p','note','本项未决/输入范围 '+fmt(range[0],1)+'—'+fmt(range[1],1)+'；来源是具体未决条件，不是按材料数量扣分。');const f=item.followup;if(f&&f.status==='pending'){const p=add(b,'div','pending');add(p,'strong','','值得补问：'+f.question);add(p,'small','','线索：'+str(f.positive_signal));}const rule=item.rule||item.rule_detail||{};const rd=add(b,'details','');add(rd,'summary','','本项分档与权重');const rb=add(rd,'div','');add(rb,'p','','轴内等权 '+fmt(item.within_axis_weight??(100/6),2)+'%；全局 '+fmt(item.global_weight,3)+'%。'+str(rule.construct||''));const anchors=rule.anchors||{};if(Object.keys(anchors).length){const ul=add(rb,'ul','anchor-list');for(const[k,v]of Object.entries(anchors)){const li=add(ul,'li',Number(k)===item.selected_anchor?'active':'');add(li,'b','',k);add(li,'span','',typeof v==='string'?v:JSON.stringify(v));}}if(rule.numeric_rule)add(rb,'p','','数值曲线为公开项目标尺；外部原表只为原值参照，不构成人口总能力分。');const ev=add(b,'details','');add(ev,'summary','','实际材料与日期');for(const e of list(item.evaluation?.evidence))add(e for(const a of axes){const card=add($('axes'),'article','axis-card');card.id='axis-'+a.id;const head=add(card,'div','axis-head');const t=add(head,'div','axis-title');add(t,'span','axis-letter',a.id);add(t,'h3','',a.name);const n=add(head,'div','axis-score',a.score??'—');add(n,'small','','/100');add(card,'p','axis-roast',a.headline||'按已观察到的表现来评。');add(card,'p','axis-summary',a.summary||'');const c=add(card,'p','coverage');add(c,'span','','已评 '+list(a.items).filter(i=>finite(i.score)).length+'/6项');add(c,'span','','权重覆盖 '+fmt(cov(a),1)+'%');if(finite(a.lower)&&finite(a.upper)&&a.lower!==a.upper)add(c,'b','','完整/未决范围 '+fmt(a.lower,1)+'—'+fmt(a.upper,1));const actions=add(card,'details','');add(actions,'summary','','先改哪一件事');const ul=add(actions,'ul','actions');for(const action of list(a.actions))add(ul,'li','',action);const ledger=add(card,'details','ledger');add(ledger,'summary','','查六项评分、覆盖范围与具体依据');for(const item of list(a.items))itemView(ledger,item);}
const pending=list(data.followups);if(!pending.length)$('followup-section').hidden=true;for(const f of pending){const card=add($('followups'),'article','followup');add(card,'span','tag',f.status==='answered'?'已补充':'关键缺口 · '+(f.items||[]).join(' / '));add(card,'h3','',f.title||'一个区别问题');add(card,'p','',f.question);add(card,'small','',f.reason||'已有积极线索，补充后只重评受影响的子项。');if(f.answer)add(card,'p','',f.answer);}
for(const[groupIndex,g]of list(data.regions).entries()){const tab=add($('region-tabs'),'button','region-tab',g.label);tab.type='button';tab.dataset.region=g.id;tab.setAttribute('aria-pressed',String(groupIndex===0));const panel=add($('regions'),'article','region-panel');panel.dataset.region=g.id;panel.hidden=groupIndex!==0;tab.addEventListener('click',()=>{document.querySelectorAll('.region-tab').forEach(t=>t.setAttribute('aria-pressed',String(t===tab)));document.querySelectorAll('.region-panel').forEach(p=>p.hidden=p!==panel);});const review=g.review||{},rAxes=list(review.axes),height=review.height||{},income=review.income||{},coords=g.other_coords||{};const top=add(panel,'div','region-top');const tl=add(top,'div','');add(tl,'h3','',g.label);add(tl,'p','note','保留当前生活的参考版 · 完整六维均展示，地区坐标只改变有明示规则的项');const rt=add(top,'div','mini-total','多坐标');add(rt,'small','','六维参考分与地区条件分开');const grid=add(panel,'div','region-axis-grid');for(const a of rAxes){const el=add(grid,'div','region-axis');add(el,'span','',a.name);add(el,'b','',a.score??'—');const bar=add(el,'div','bar');add(bar,'i','').style.width=(a.score||0)+'%';add(el,'small','',a.id==='A'?'身高参照单列':a.id==='E'?'只替换收入坐标':'沿用同一任务/现状');}const cg=add(panel,'div','coords');const physical=add(cg,'div','coord');add(physical,'h4','','身体条件与任务');const h=g.height_reference_cm??height.reference_cm??height.mean_cm;const own=height.height_cm??data.assessment_facts?.height_cm;const gap=finite(own)&&finite(h)?own-h:null;add(physical,'p','big',finite(gap)?(gap>=0?'+':'')+fmt(gap,1)+' cm':'当地身高参照待补');const hi=rAxes.flatMap(a=>list(a.items)).find(i=>i.id==='A1');add(physical,'p','','身高突出坐标 '+fmt(hi?.score,1)+' /100（项目曲线）');add(physical,'p','','本人 '+fmt(own,1)+'cm；参照均高 '+fmt(h,1)+'cm。突出坐标按50＋2×厘米差，仍是项目曲线。');if(g.height_percentile)add(physical,'p','',g.height_percentile);add(physical,'small','',g.height_scope||'年龄/年份按原参照说明；均值不是个体分布，不能由此编百分位。');link(physical,g.height_source_url,'身高原始来源 ↗');add(physical,'p','',coords.body||'历史卧推与连续游泳按同一动作/任务保留，不随国别改写。');const economic=add(cg,'div','coord');add(economic,'h4','','财务容量与相对收入');const selected=list(g.income_rows).find(row=>row.label===review.selected_case)||list(g.income_rows)[0]||{};const annual=selected.annual_cny;const ownAnnual=data.assessment_facts?.self_annual_cny;add(economic,'p','big',finite(annual)&&finite(ownAnnual)?fmt(ownAnnual/annual,2)+' ×工资参照':'收入坐标待补');const ei=rAxes.flatMap(a=>list(a.items)).find(i=>i.id==='E1');add(economic,'p','','收入相对坐标 '+fmt(ei?.score,1)+' /100（项目曲线）');add(economic,'p','',str(selected.label||'所选参照')+'：约'+(finite(annual)?fmt(annual/10000,2)+'万元人民币/年':'待补')+'。');add(economic,'small','',str(selected.age_note||'')+' '+str(selected.source_value||''));link(economic,selected.source_url,'工资原始来源 ↗');add(economic,'p','',coords.finance||'资产、现金和家庭支持保持真实容量，不再除以这个工资参照。');const resources=add(cg,'div','coord');add(resources,'h4','','资源与落地适配');add(resources,'p','',coords.resources||'当前真实住房、照护、协作与工具条件保留；不能因切换地区自动认定丢失。');add(resources,'p','',coords.relocation||'迁居后的工作语言、实际岗位报价、资格及当地帮助未实测，单独待核；未提供不判零，也不扣思考或专业分。');add(resources,'small','',coords.thinking||'思考、交付等为同任务表现；没有当地人群常模，保持同分不等于当地排名相同。');const changes=add(panel,'details','');add(changes,'summary','','这次换地区，哪些分变了');add(changes,'p','note','可选等权参考合成 '+fmt(review.overall?.score_exact,3)+'，显示'+str(review.overall?.score)+'；只有有明示坐标的子项替换，不能称完整当地竞争排名。');const ul=add(changes,'ul','change-list');add(ul,'li','','A1：只改身高突出坐标；面部、穿搭不按国别猜审美。');add(ul,'li','','E1：只改本人税前年化与当地工资的比值；E2/E3/F1不再随同一工资重复变分。');add(ul,'li','','B/C/D及其他资源项按实际资料保留；迁居条件另列，未知不当失败。');for(const note of list(review.limitations))add(changes,'p','note',note);add(panel,'p','reference-strip','这些是参考坐标下的项目分，不是当地人口排名或就业成功率。'+str(data.regional_note||''));}
const rules=$('rules');add(rules,'p','','六轴及各轴六项均以1个权重单位起步，自动归一。等权是透明默认选择，没有研究证明它是唯一正确比例；先让每项测清楚，再讨论特定用途的权重。');const rg=add(rules,'div','rule-grid');for(const[title,copy]of[['表现与材料分开','材料覆盖不乘分、不奖励答题长度、不因为缺高档材料默认基本档。缺整项则保留未知与原权重。'],['内容锚点','行为/形象按本项0/25/50/75/100条件选档；数值按连续曲线。换五档不是科学校准，也不保证数字一定分散。'],['只问有价值的区别','已有积极线索、关键条件未明且答案可能改变判断时，中立追问一次；没有明显高档线索继续，尚未观察不等于不会。'],['财务与调用条件','现金用真实必要开支月数，资产用真实必要开支年数；明确不可用支持先归零，不能靠大额潜在额度抵消。']]){const el=add(rg,'div','');add(el,'h4','',title);add(el,'p','',copy);}add(rules,'h4','','合成只描述这份资料');add(rules,'p','formula','全局子项权重 = 主轴权重单位占比 × 轴内权重单位占比\n已知均衡读数 = Σ(子项分 × 全局权重) ÷ 已知全局权重\n完整下/上界 = Σ(每项下/上界 × 全局权重) ÷ 100');add(rules,'p','','本版可选均衡读数 '+fmt(overall.score_exact,3)+'，显示'+str(overall.score)+'；已知权重'+fmt(cov(overall),2)+'%。完整条件边界'+fmt(overall.lower,2)+'—'+fmt(overall.upper,2)+'使用全部权重分母，不是这个读数的统计置信区间。');add(rules,'h4','','数值标尺为何仍需声明');add(rules,'p','','收入覆盖和资产年数用100×x/(x+1)，现金月数用100×x/(x+3)，避免小额跨档骤跳。系数与高个偏好仍是项目选择；训练平台负荷与官方均高只提供参照，不能证明这些转分已被校准。每项实际输入、范围和规则可在账本查看。');$('version-note').textContent=data.version_note||'本次分数变化来自重设规则和重新读取已有材料，不等于你在几天内突然进步。保留旧报告，后续新增回答仅局部复测。';$('footer').textContent='来源档案修订 '+str(data.source_revision)+' · '+str(data.date)+' · 原测量/资产日期分别保留 · 私人离线报告，不公开个人原件';window.__REPORT_READY__=true;
})();
