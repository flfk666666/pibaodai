function lifeStatus(value){if(value==null||value==='')return'待确认';const text=narrativeText(value);const labels={active:'当前推进',current:'当前方向',confirmed:'已确认',reviewed:'已复核',historical:'历史记录',historical_awaiting_review:'历史记录 · 待复核',needs_review:'待复核',pending_review:'待复核',awaiting_review:'待复核',unconfirmed:'待确认',pending:'待确认',unknown:'尚未明确',unresolved:'尚未明确',exploring:'探索中',exploration:'探索中',exploratory:'探索中',paused:'暂缓',on_hold:'暂缓',provisional:'阶段观察',observed:'已有材料',unscored:'文字观察',not_scored:'文字观察',supported:'已有支持',limited:'存在制约',mixed:'支持与制约并存',in_progress:'进行中',started:'已行动',completed:'已完成',planned:'尚待行动',idea:'想法',goal:'目标',priority:'当前优先',habit:'日常习惯',interest:'兴趣',experiment:'探索试验',support:'支持',supports:'支持',constraint:'制约',constrains:'制约',resource:'资源',tradeoff:'取舍',enabler:'支持'};return labels[text]||(/[\u3400-\u9fff]/.test(text)?text:'状态待确认');}
function lifeChip(parent,value){if(value==null||value==='')return;const chip=add(parent,'span','life-chip',lifeStatus(value));chip.dataset.status=narrativeText(value);if(/review|pending|unknown|unconfirmed|未|待/.test(chip.dataset.status))chip.classList.add('is-pending');if(/^(active|current|confirmed|in_progress|started)$/.test(chip.dataset.status))chip.classList.add('is-active');return chip;}
function lifeDate(value){return value==null||value===''?'未知':narrativeText(value)||'未知';}
function lifeSourceText(value){
  const fields={current_body_weight_kg:'体重',performance:'运动表现',strength_sessions_per_week:'每周力量训练',training_years:'训练经历',chosen_action:'选择的行动',decision_rationale:'决策理由',goal:'目标',self_media_choices:'创作选择',action_after_reflection:'复盘后的行动',own_contribution:'本人贡献'};
  // Keep public URLs intact; local source names never become public labels.
  return narrativeText(value).split(/(https?:\/\/[^\s；;，。！？、"'<>（）]+)/gi).map(text=>{
    if(/^https?:\/\//i.test(text))return text;
    text=text.replace(/(?:[A-Za-z]:[\\/][^\r\n；;，。！？、"'<>：（）]*?|[^\s；;，。！？、"'<>：（）]*?)current\.md#\/items\/([A-F][1-6])\/inputs(?:\/([A-Za-z0-9_]+))?/g,(_,id,field)=>'角色档案 · '+id+' '+(itemLookup[id]?.name||'子项材料')+' · '+(fields[field]||'本人输入'));
    return text.replace(/[A-Za-z]:[\\/][^；;，。！？、"'<>：（）\r\n]+|[^\s；;，。！？、"'<>：（）]+/g,token=>{
      const local=/^(?:[A-Za-z]:[\\/]|\\\\|\/|~[\\/]|\.{1,2}[\\/])/.test(token)||/^[A-Za-z0-9_.~-]+(?:[\\/][A-Za-z0-9_.~-]+)+(?:#.*)?$/.test(token)||/^(?:[^\\/:]+[\\/])*[^\\/:]+\.[A-Za-z][A-Za-z0-9_-]{0,11}(?:#.*)?$/.test(token);
      return local?'本地私人记录':token.replace(/self_report/g,'本人自述').replace(/#/g,' · ');
    });
  }).join('');
}
